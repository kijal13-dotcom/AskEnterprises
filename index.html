<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#FFF7E8;color:#1c2333}.wrap{max-width:1180px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.brand img{height:100px;width:auto}.brand h1{margin:0;font-family:Georgia,serif;font-size:38px}.brand p{margin:6px 0 0;color:#5b6472}
.btn{border:1px solid #e6d9bd;background:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600}.btn.primary{background:#131f3a;color:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}.tab{border:1px solid transparent;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:#5b6472}.tab.active{background:#7c3aed;color:#fff}
.panel{background:#fff;border:1px solid #f5e8b8;border-radius:16px;padding:14px;margin-bottom:14px}.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{border:1px solid #f0e0a8;background:#fff;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}.pill.active{background:#111;color:#fff}
.controls2{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;align-items:center}.controls2 select,.controls2 input{padding:8px;border:1px solid #eee;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:1px solid #f5e8b8;border-radius:16px;padding:16px;border-top:6px solid #7c3aed}.card small{color:#6b7280;text-transform:uppercase;font-size:12px;letter-spacing:.5px}.card b{font-size:28px;display:block;margin:8px 0 4px;font-family:Georgia,serif}.card span{color:#6b7280;font-size:13px}
.mini{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:12px 0}@media(max-width:900px){.mini{grid-template-columns:repeat(4,1fr)}}
.mini div{background:#fff;border:1px solid #f5e8b8;border-radius:14px;padding:12px}.mini small{color:#6b7280}.mini b{font-size:18px;display:block;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #f0e6cf;font-size:13px;text-align:left}th{background:#131f3a;color:#fff}
.tot{font-weight:800;background:#FFF3D6}.group{cursor:pointer;background:#f8f1dc;font-weight:700;padding:8px}.hidden{display:none}.muted{color:#6b7280;font-size:13px}
.warn{background:#FFF3CD;border:1px solid #FFE08A;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px}.box label{display:block;font-size:13px;margin:10px 0 4px}.box input,.box select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.toprow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #fdf0b8}

/* --- MOBILE-FRIENDLY (layout only, no data/UI logic change) --- */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{width:100%}
.panel{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{min-width:620px;white-space:nowrap}
table th,table td{white-space:nowrap}
input,select,textarea{font-size:16px;max-width:100%}
button,.btn,.tab,.pill{min-height:40px}
@media(max-width:640px){
  .wrap{padding:10px}
  header{flex-direction:column;align-items:flex-start;gap:8px}
  .brand{gap:10px;width:100%}
  .brand img{height:64px}
  .brand h1{font-size:26px;line-height:1.1}
  .brand p{font-size:13px}
  .toprow{flex-direction:column;gap:6px;align-items:flex-start}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:12px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:10px 14px}
  .pills{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .pill{flex:0 0 auto}
  .controls2{flex-direction:column;align-items:stretch;gap:8px}
  .controls2 select,.controls2 input,.controls2 label{width:100%}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{padding:12px}
  .card b{font-size:20px}
  .mini{grid-template-columns:repeat(2,1fr);gap:8px}
  .mini div{padding:10px}
  .mini b{font-size:16px}
  .grid2{grid-template-columns:1fr;gap:10px}
  .panel{padding:10px;border-radius:12px}
  table{min-width:600px}
  th,td{padding:8px 7px;font-size:13px}
  .group{padding:10px 8px;font-size:14px}
  .btn{padding:10px 14px}
  .modal{padding:0;align-items:flex-end}
  .box{max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;padding:16px}
  .box .row{flex-wrap:wrap}
  .box .row .btn{flex:1 1 auto}
}
@media(max-width:380px){
  .cards{grid-template-columns:1fr 1fr}
  .card b{font-size:18px}
  .brand h1{font-size:22px}
}

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsK-MChzCkU6bENLsQtiubtuq6a436dvQhz_dBURvtVBiilwBf9kERH_5qGqRJpxnz/exec";

let DB={inventory:[],purchases:[],orders:[],expenses:[],payments:[]};
let tab='Dashboard',editIdx=null,editKind=null,rangeSel='all',searchQ='',customFrom='',customTo='';
const TABS=['Dashboard','Inventory','Purchases','Orders','Returns','Expenses','Payments','Reports & P&L'];
const RANGES=[['today','Today'],['week','This Week'],['month','This Month'],['mtd','Month-to-Date'],['ytd','Year-to-Date'],['fy','Financial Year (Apr-Mar 2026-27)'],['all','All Time'],['custom','Custom']];
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function parseD(s){let d=new Date(s);return isNaN(d)?null:d}
function fmtD(v){if(!v) return ''; if(v instanceof Date) return v.toISOString().slice(0,10); let s=String(v).trim(); let p=new Date(s); return isNaN(p)?s:p.toISOString().slice(0,10)}
function rangeDates(){let now=new Date(),s=null,e=now; if(rangeSel==='today')s=new Date(now.getFullYear(),now.getMonth(),now.getDate()); else if(rangeSel==='week'){s=new Date(now);s.setDate(now.getDate()-6)} else if(rangeSel==='month'||rangeSel==='mtd')s=new Date(now.getFullYear(),now.getMonth(),1); else if(rangeSel==='ytd')s=new Date(now.getFullYear(),0,1); else if(rangeSel==='fy')s=new Date(now.getMonth()>=3?now.getFullYear():now.getFullYear()-1,3,1); else if(rangeSel==='custom'){s=parseD(customFrom);e=parseD(customTo)||now} if(rangeSel==='all')return null; return{s,e}}
function inRange(dstr){let rg=rangeDates(); if(!rg)return true; let d=parseD(dstr); return d&&d>=rg.s&&d<new Date(rg.e.getTime()+86400000)}
function monthName(ym){let y=+ym.slice(0,4),m=+ym.slice(5,7)-1; return new Date(y,m,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}
function toggleEl(id){document.getElementById(id).classList.toggle('hidden')}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tab ${t===tab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}
function setTab(t){tab=t;renderTabs();render()} function setRange(r){rangeSel=r;render()}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function table(head,rows,totals){return `<div style="overflow:auto"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.join('')}${totals?`<tr class="tot">${totals}</tr>`:''}</table></div>`}
function monthGroupHTML(rows,getDate,head,rowFn,totFn,prefix){let map={}; rows.forEach(r=>{let k=(getDate(r)||'').slice(0,7)||'No date'; (map[k]=map[k]||[]).push(r)}); let out=''; Object.keys(map).sort().reverse().forEach(k=>{let gid=prefix+'_'+k.replace(/[^A-Za-z0-9]/g,'_')+'_'+Math.random().toString(36).slice(2,6); let totRow=`<tr class="tot">${totFn(map[k])}</tr>`; out+=`<div class="group" onclick="toggleEl('${gid}')">+ ${monthName(k)} - ${map[k].length} rows</div><div id="${gid}">`+table(head,[totRow,...map[k].map(rowFn)],null)+'</div>';}); return out;}
function calc(){let ord=DB.orders.filter(o=>inRange(o[0])); let del=ord.filter(o=>o[4]==='Delivered'); let ret=ord.filter(o=>o[4]==='Return Requested'); let sales=del.reduce((a,o)=>a+(+o[6]||0),0),cogs=del.reduce((a,o)=>a+(+o[7]||0),0),gross=sales-cogs; let purch=DB.purchases.filter(p=>inRange(p[1])).reduce((a,p)=>a+(+p[7]||0),0); let exp=DB.expenses.filter(e=>inRange(e[0])).reduce((a,e)=>a+(+e[4]||0),0); let settle=DB.payments.filter(p=>inRange(p[2])).reduce((a,p)=>a+(+p[3]||0),0); return{ord,del,ret,sales,cogs,gross,purch,exp,net:gross-exp,settle}}
function filterSearch(rows){if(!searchQ) return rows; let q=searchQ.toLowerCase(); return rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}
function render(){
 let c=calc(); let v=document.getElementById('view');
 let pills=`<div class="panel"><div class="pills"><b>📅 Date range</b>${RANGES.map(([k,l])=>`<button class="pill ${rangeSel===k?'active':''}" onclick="setRange('${k}')">${l}</button>`).join('')}</div><div class="controls2"><label style="flex:1"><input style="width:100%" placeholder="Search rows..." value="${esc(searchQ)}" onkeydown="if(event.key==='Enter'){searchQ=this.value;render()}"></label><span class="muted">${rangeSel==='all'?'All time':rangeSel} · ${c.ord.length} orders in view</span></div>${rangeSel==='custom'?`<div style="margin-top:10px"><input type="date" value="${customFrom}" onchange="customFrom=this.value;render()"> <input type="date" value="${customTo}" onchange="customTo=this.value;render()"></div>`:''}</div>`;
 if(tab==='Dashboard'){
  let byM={}; c.del.forEach(o=>{let k=o[0].slice(0,7); byM[k]=byM[k]||{sales:0,gross:0}; byM[k].sales+=+o[6]||0; byM[k].gross+=(+o[6]- +o[7])||0;});
  DB.expenses.filter(e=>inRange(e[0])).forEach(e=>{let k=e[0].slice(0,7); if(byM[k]) byM[k].exp=(byM[k].exp||0)+(+e[4]||0); else byM[k]={sales:0,gross:0,exp:+e[4]||0};});
  let months=Object.keys(byM).sort().reverse(); let byP={}; c.del.forEach(o=>{let k=o[3]||'Unknown'; byP[k]=byP[k]||{sold:0,sales:0,net:0}; byP[k].sold+=+o[5]||0; byP[k].sales+=+o[6]||0; byP[k].net+=(+o[6]- +o[7])||0;});
  let tops=Object.entries(byP).sort((a,b)=>b[1].net-a[1].net).slice(0,6);
  v.innerHTML=pills+`<div class="cards"><div class="card" style="border-top-color:#7c3aed"><small>Total Sales</small><b>${inr(c.sales)}</b><span>Delivered only</span></div><div class="card" style="border-top-color:#db2777"><small>Total Purchases</small><b>${inr(c.purch)}</b><span>In range</span></div><div class="card" style="border-top-color:#0d9488"><small>Gross Profit</small><b>${inr(c.gross)}</b><span>Sales – COGS</span></div><div class="card" style="border-top-color:#f59e0b"><small>Total Expenses</small><b>${inr(c.exp)}</b><span>In range</span></div><div class="card" style="border-top-color:#16a34a"><small>Net Profit</small><b>${inr(c.net)}</b><span>Gross – Expenses</span></div></div><div class="mini"><div><small>Orders</small><b>${c.ord.length}</b></div><div><small>Delivered</small><b>${c.del.length}</b></div><div><small>Returns</small><b>${c.ret.length}</b></div><div><small>Return %</small><b>${c.ord.length?(c.ret.length/c.ord.length*100).toFixed(1):0}%</b></div><div><small>Cancellation %</small><b>0.0%</b></div><div><small>Avg Order Value</small><b>${inr(c.del.length?c.sales/c.del.length:0)}</b></div><div><small>Settlement Received</small><b>${inr(c.settle)}</b></div><div><small>Inventory Net Stock</small><b>${DB.inventory.reduce((a,i)=>a+(+i[5]||0),0)} units</b></div></div><div class="grid2"><div class="panel"><h3>Month-wise sales & profit</h3><table><tr><th>MONTH</th><th>SALES</th><th>PROFIT</th><th>NET</th></tr>${months.map(k=>`<tr><td>${monthName(k)}</td><td>${inr(byM[k].sales)}</td><td>${inr(byM[k].gross)}</td><td style="color:#16a34a;font-weight:700">${inr(byM[k].gross-(byM[k].exp||0))}</td></tr>`).join('')||'<tr><td colspan="4">No data</td></tr>'}</table></div><div class="panel"><h3>Top products by Net Profit</h3>${tops.map(([name,p],i)=>`<div class="toprow"><div><b style="color:#7c3aed">${i+1}.</b> ${esc(name)}<br><span class="muted">${p.sold} sold · Sales ${inr(p.sales)}</span></div><b style="color:#16a34a">${inr(p.net)}</b></div>`).join('')||'No data'}</div></div>`; return;
 }

function showWarn(msg){let el=document.getElementById('saveWarn'); el.style.display='block'; el.innerHTML=msg}
async function loadData(){
 if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')){document.getElementById('syncStatus').textContent='Portal frozen. Paste your Web App /exec URL into APPS_SCRIPT_URL, then Refresh. Sheet ID is already set in Apps Script.'; return;}
 document.getElementById('syncStatus').textContent='Loading from Cloud Google Sheet…';
 try{
  let r=await fetch(APPS_SCRIPT_URL+'?action=read&t='+Date.now()); let j=await r.json(); if(!j.ok) throw new Error(j.error||'Apps Script error');
  DB.inventory=(j.data.Inventory||[]).map(r=>[r[1],+r[2]||0,+r[3]||0,+r[4]||0,+r[5]||0,+r[6]||0, (r[7]===''||r[7]==null?'':+r[7]||0), +r[8]||0]);
  DB.purchases=(j.data.Purchases||[]).map(r=>[String(r[0]),fmtD(r[1]),String(r[2]||''),String(r[3]||''),+r[4]||0,+r[5]||0,+r[6]||0,+r[7]||0,String(r[8]||'')]);
  DB.orders=(j.data.Orders||[]).map(r=>{if(r.length<=12) return [fmtD(r[0]),String(r[1]||''),String(r[2]||''),String(r[3]||''),String(r[4]||''),+r[5]||0,+r[6]||0,+r[7]||0,+r[8]||0,String(r[9]||'')]; return [fmtD(r[0]),String(r[3]||''),String(r[8]||''),String(r[9]||'').slice(0,80),String(r[5]||''),+r[18]||0,+r[15]||0,+r[40]||0,+r[41]||0,String(r[24]||'')];}).filter(r=>r[1]);
  DB.expenses=(j.data.Expenses||[]).map(r=>[fmtD(r[0]),String(r[1]||''),String(r[2]||''),String(r[3]||''),+r[4]||0,+r[5]||0,+r[6]||0,+r[7]||0,String(r[8]||'')]);
  DB.payments=(j.data.Payment||[]).map(r=>{if(r.length<=12) return [String(r[0]||''),String(r[1]||''),fmtD(r[2]),+r[3]||0,+r[4]||0,+r[5]||0,String(r[6]||''),+r[7]||0,+r[8]||0,+r[9]||0]; return [String(r[0]||'').trim(),String(r[1]||''),fmtD(r[2]),+r[3]||0,+r[4]||0,+r[5]||0,String(r[7]||''),+r[9]||0,+r[13]||0,+r[17]||0];}).filter(r=>r[0]);
  document.getElementById('syncStatus').textContent='Live from Cloud Google Sheet - refreshed '+new Date().toLocaleString('en-IN')+' | Purchases: '+DB.purchases.length+' | Expenses: '+DB.expenses.length+' | Orders: '+DB.orders.length;
  render();
 }catch(e){document.getElementById('syncStatus').textContent='Could not load: '+e.message+' - check Apps Script deployment (Execute as Me, Anyone) and that you used New version, not a new deployment.';}
}
async function pushToSheet(action,kind,row,oldRow){
 document.getElementById('saveBtn').disabled=true;
 try{let r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,kind,row,oldRow:oldRow||null})}); let j=await r.json(); if(!j.ok) throw new Error(j.error||'Apps Script error'); showWarn('Saved to Cloud Google Sheet.'); await loadData(); return true;}
 catch(e){showWarn('Could NOT save: '+e.message+'. Nothing was changed.'); return false;}
 finally{document.getElementById('saveBtn').disabled=false;}
}
function openPurchase(idx){editKind='purchase';editIdx=idx??null;let p=idx!=null?DB.purchases[idx]:['PO-'+(DB.purchases.length+1),new Date().toISOString().slice(0,10),'','',1,0,0,0,'UPI']; document.getElementById('mtitle').textContent=idx!=null?'Edit Purchase':'Add Purchase'; document.getElementById('mbody').innerHTML=`<label>PO No</label><input id="f0" value="${esc(p[0])}"><label>Date</label><input type="date" id="f1" value="${p[1]}"><label>Supplier</label><input id="f2" value="${esc(p[2])}"><label>Product SKU</label><input id="f3" value="${esc(p[3])}"><label>Qty</label><input type="number" id="f4" value="${p[4]}"><label>Cost Price</label><input type="number" id="f5" value="${p[5]}"><label>GST %</label><input type="number" id="f6" value="${p[6]}"><label>Payment</label><select id="f8"><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Credit</option></select>`; document.getElementById('f8').value=p[8]; document.getElementById('modal').classList.add('open')}
function editPurchase(i){openPurchase(i)}
async function delPurchase(i){if(!confirm('Delete this purchase from the Cloud Sheet?'))return; await pushToSheet('delete','purchase',DB.purchases[i],DB.purchases[i])}
function openExpense(idx){editKind='expense';editIdx=idx??null;let e=idx!=null?DB.expenses[idx]:[new Date().toISOString().slice(0,10),'Transportation Cost','','',0,0,0,0,'UPI']; document.getElementById('mtitle').textContent=idx!=null?'Edit Expense':'Add Expense'; document.getElementById('mbody').innerHTML=`<label>Date</label><input type="date" id="f0" value="${e[0]}"><label>Category</label><select id="f1"><option>Marketplace Fees</option><option>Shipping/Courier</option><option>Advertising</option><option>Packaging</option><option>Office/Admin</option><option>Transportation Cost</option><option>Miscellaneous</option><option>Travelling Cost</option><option>Fooding</option></select><label>Description</label><input id="f2" value="${esc(e[2])}"><label>Vendor</label><input id="f3" value="${esc(e[3])}"><label>Amount</label><input type="number" id="f4" value="${e[4]}"><label>GST %</label><input type="number" id="f5" value="${e[5]}"><label>Payment Mode</label><select id="f8"><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Credit</option></select>`; document.getElementById('f1').value=e[1]; document.getElementById('f8').value=e[8]; document.getElementById('modal').classList.add('open')}
function editExpense(i){openExpense(i)}
async function delExpense(i){if(!confirm('Delete this expense from the Cloud Sheet?'))return; await pushToSheet('delete','expense',DB.expenses[i],DB.expenses[i])}
async function saveWithUs(idx,val){let row=DB.inventory[idx]; if(!row) return; let withUs=val===''||val==null?0:+val; if(isNaN(withUs)||withUs<0){showWarn('With Us must be 0 or more.'); await loadData(); return;} if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes('PASTE_YOUR')){showWarn('Paste your Web App /exec URL first - With Us was not saved to Drive.'); return;} try{let r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'update_inventory',kind:'inventory',row:[row[0],withUs]})}); let j=await r.json(); if(!j.ok) throw new Error(j.error||'Apps Script error'); showWarn('With Us saved to Cloud Sheet for '+row[0]+'.'); await loadData();}catch(e){showWarn('Could NOT save With Us: '+e.message+'. Nothing was changed.');}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function saveModal(){let action=editIdx!=null?'edit':'add',kind=editKind,row=null; let oldRow=editIdx!=null?JSON.parse(JSON.stringify(editKind==='purchase'?DB.purchases[editIdx]:DB.expenses[editIdx])):null; if(editKind==='purchase'){let q=+document.getElementById('f4').value,cost=+document.getElementById('f5').value; row=[document.getElementById('f0').value,document.getElementById('f1').value,document.getElementById('f2').value,document.getElementById('f3').value,q,cost,+document.getElementById('f6').value,q*cost,document.getElementById('f8').value]} else {let amt=+document.getElementById('f4').value,gst=+document.getElementById('f5').value; let igst=gst?+(amt-amt/(1+gst/100)).toFixed(2):0; row=[document.getElementById('f0').value,document.getElementById('f1').value,document.getElementById('f2').value,document.getElementById('f3').value,amt,gst,igst,+(amt-igst).toFixed(2),document.getElementById('f8').value]} let ok=await pushToSheet(action,kind,row,oldRow); if(ok) closeModal()}
renderTabs(); render(); loadData();
</script></body></html>
